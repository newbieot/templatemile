plugins { id 'com.android.application' }

android {
    namespace 'com.posnew.milecamera'
    compileSdk 36
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    defaultConfig {
        applicationId 'com.posnew.milecamera'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.1.4'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        localRelease {
            if (System.getenv('MILE_SIGNING_FILE')) {
                storeFile file(System.getenv('MILE_SIGNING_FILE'))
                storePassword System.getenv('MILE_SIGNING_PASSWORD')
                keyAlias 'mile-camera'
                keyPassword System.getenv('MILE_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        release {
            minifyEnabled false
            if (System.getenv('MILE_SIGNING_FILE')) signingConfig signingConfigs.localRelease
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    testImplementation 'junit:junit:4.13.2'
}
